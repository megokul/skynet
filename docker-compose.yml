services:
  # SKYNET Control Plane API
  skynet-api:
    build:
      context: .
      dockerfile: docker/skynet/Dockerfile
    container_name: skynet-api
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS
      - SKYNET_DB_PATH=/app/data/skynet.db
      - OPENCLAW_GATEWAY_URL=http://openclaw-gateway:8766
      - OPENCLAW_GATEWAY_URLS
      - SKYNET_PROMPT_LIBRARY_DIR=/app/prompts
      - SKYNET_API_KEY
    volumes:
      - skynet-data:/app/data
      - ./skynet:/app/skynet:ro
      - ./prompts:/app/prompts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - skynet-network

  openclaw-gateway:
    build:
      context: ./openclaw-gateway
      dockerfile: Dockerfile
    container_name: openclaw-gateway
    ports:
      - "8765:8765"             # WebSocket
      - "127.0.0.1:8766:8766"  # HTTP API (loopback only — reachable via SSH tunnel)
    environment:
      - SKYNET_API_KEY
      - SKYNET_AUTH_TOKEN
      - SKYNET_BUILD_REVISION
      - SKYNET_E2E_LIVE
      - SKYNET_LIVE_E2E_FLOW
      - SKYNET_ORCHESTRATOR_URL=http://skynet-api:8000
      - OPENCLAW_GATEWAY_URL=http://openclaw-gateway:8766
      - OPENCLAW_HTTP_HOST=0.0.0.0
      - OPENCLAW_HTTP_PORT
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_ALLOWED_USER_ID
      - GOOGLE_AI_API_KEY
      - GEMINI_MODEL
      - GEMINI_ONLY_MODE
      - GROQ_API_KEY
      - OPENROUTER_API_KEY
      - OPENROUTER_MODEL
      - OPENROUTER_FALLBACK_MODELS
      - DEEPSEEK_API_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      - AI_PROVIDER_PRIORITY
      - AUTO_APPROVE_GIT_ACTIONS
      - AUTO_APPROVE_AND_START
      - AUTO_PLAN_MIN_IDEAS
      - AUTO_BOOTSTRAP_PROJECT
      - AUTO_CREATE_GITHUB_REPO
      - AUTO_CREATE_GITHUB_PRIVATE
      - AWS_REGION
      - AWS_DEFAULT_REGION
      - SKYNET_S3_BUCKET
      - SKYNET_PROJECT_BASE_DIR
      - OPENCLAW_PROJECT_BASE_DIR
      - SKYNET_DEFAULT_WORKING_DIR
      - OPENCLAW_DEFAULT_WORKING_DIR
      - SKYNET_ALWAYS_ON_PROMPT_SKILLS
      - SKYNET_EXTERNAL_SKILLS_DIR
      - SKYNET_EXTERNAL_SKILLS_CACHE_DIR
      - SKYNET_EXTERNAL_SKILL_URLS
      - OPENCLAW_EXECUTION_MODE
      - OPENCLAW_SSH_FALLBACK_ENABLED
      - OPENCLAW_SSH_HOST
      - OPENCLAW_SSH_PORT
      - OPENCLAW_SSH_USER
      - OPENCLAW_SSH_PASSWORD
      - OPENCLAW_SSH_KEY_PATH
      - OPENCLAW_SSH_KEY_FILE
      - OPENCLAW_SSH_CONNECT_TIMEOUT
      - OPENCLAW_SSH_COMMAND_TIMEOUT
      - OPENCLAW_SSH_HEALTH_CACHE_SECONDS
      - OPENCLAW_SSH_REMOTE_OS
      - OPENCLAW_SSH_ALLOWED_ROOTS
      - OPENCLAW_SSH_STRICT_HOST_KEY
      - OPENCLAW_SSH_CODEX_BIN
      - OPENCLAW_SSH_CLAUDE_BIN
      - OPENCLAW_SSH_CLINE_BIN
      - OPENCLAW_OLLAMA_URL
      - OPENCLAW_OLLAMA_MODEL
      - GH_TOKEN
      - DISABLE_TELEGRAM_BOT
      - OPENCLAW_LOG_LEVEL
      - SKYNET_LOG_ENABLE_LOCAL_FILES
      - SKYNET_LOG_ENABLE_SSH_MIRROR
      - SKYNET_LOG_S3_ENABLED
      - SKYNET_LOG_S3_PREFIX
      - SKYNET_TRACE_MIRROR_LOG_DIR
      - SKYNET_PROMPT_LIBRARY_DIR=/app/prompts
    volumes:
      - openclaw-data:/app/data
      - ./openclaw-gateway/external-skills:/app/external-skills:ro
      - ./skynet:/app/skynet:ro
      - ./prompts:/app/prompts:ro
      - ${OPENCLAW_SSH_KEY_FILE:-/dev/null}:${OPENCLAW_SSH_KEY_PATH:-/app/keys/laptop_ed25519}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      skynet-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - skynet-network

volumes:
  skynet-data:
    driver: local
  openclaw-data:
    driver: local

networks:
  skynet-network:
    driver: bridge
