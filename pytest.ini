[pytest]
# Pytest configuration for SKYNET

# Default pytest discovery is intentionally limited to component suites.
# Curated root tests under tests/ are invoked explicitly via Makefile / smoke.
testpaths = openclaw-gateway/tests openclaw-agent/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    .git
    .pytest_cache
    .pytest-qwen-probe
    .pytest-tmp
    .tmp
    __pycache__
    venv
    venv-agent
    logs
    openclaw-agent/logs
    openclaw-agent/MyProjectsskynetlogs
    openclaw-gateway/tests/.artifacts

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    e2e: End-to-end workflow tests
    live: Manual external/live end-to-end tests (SSH/GitHub/planner)
    slow: Tests that take longer to run
    provider: Provider-specific tests

# Async support
asyncio_mode = auto
