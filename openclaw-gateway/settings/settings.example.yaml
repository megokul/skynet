# Minimal operator overlay example for openclaw-gateway.
#
# Authoritative non-secret defaults live in:
# - skynet/settings/defaults.yaml
# - openclaw-gateway/settings/settings.yaml
# - openclaw-agent/settings/defaults.yaml
#
# Copy only the keys you actually need into settings.local.yaml or the
# environment. Do not treat this file as a second source of truth.

# Example: worker/project path overrides for a local workstation
OPENCLAW_PROJECT_BASE_DIR: 'E:\SKYNET-SANDBOX\Projects'
OPENCLAW_DEFAULT_WORKING_DIR: 'E:\SKYNET-SANDBOX'

# Example: local log/trace overrides
SKYNET_TRACE_MIRROR_LOG_DIR: logs
SKYNET_RUNTIME_TRACE_LIVE_FILE: logs/skynet.trace.log

# Example: live E2E local override
SKYNET_LIVE_E2E_DIAGNOSTICS_PROFILE: tunnel
