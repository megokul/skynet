name: SKYNET CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: skynet-ci-cd
  cancel-in-progress: true

jobs:
  guard:
    name: Path Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check stale paths
        run: python scripts/ci/check_stale_paths.py

      - name: Check control-plane boundary
        run: python scripts/ci/check_control_plane_boundary.py

      - name: Check settings policy
        run: python scripts/ci/check_settings_policy.py

      - name: Check engineering policy
        run: python scripts/ci/check_engineering_policy.py --base-ref HEAD~1 --head-ref HEAD

  deploy:
    name: Deploy on self-hosted runner
    needs: guard
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repo
    permissions:
      contents: read
    env:
      OPENCLAW_GATEWAY_URLS: ${{ secrets.OPENCLAW_GATEWAY_URLS }}
      SKYNET_API_KEY: ${{ secrets.SKYNET_API_KEY }}
      SKYNET_AUTH_TOKEN: ${{ secrets.SKYNET_AUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENCLAW_SSH_HOST: ${{ secrets.OPENCLAW_SSH_HOST }}
      OPENCLAW_SSH_PORT: ${{ secrets.OPENCLAW_SSH_PORT }}
      OPENCLAW_SSH_USER: ${{ secrets.OPENCLAW_SSH_USER }}
      OPENCLAW_SSH_PASSWORD: ${{ secrets.OPENCLAW_SSH_PASSWORD }}
      OPENCLAW_SSH_KEY_PATH: ${{ secrets.OPENCLAW_SSH_KEY_PATH }}
      OPENCLAW_SSH_KEY_FILE: ${{ secrets.OPENCLAW_SSH_KEY_FILE }}
      OPENCLAW_SSH_PRIVATE_KEY_B64: ${{ secrets.OPENCLAW_SSH_PRIVATE_KEY_B64 }}
      OPENCLAW_LAPTOP_SSH_PUBLIC_KEY: ${{ secrets.OPENCLAW_LAPTOP_SSH_PUBLIC_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OPENCLAW_OLLAMA_URL: ${{ secrets.OPENCLAW_OLLAMA_URL }}
      OPENCLAW_OLLAMA_MODEL: ${{ secrets.OPENCLAW_OLLAMA_MODEL }}
      OPENCLAW_OLLAMA_AUTO_PULL: ${{ secrets.OPENCLAW_OLLAMA_AUTO_PULL }}
      SKYNET_CLAUDE_OLLAMA_AUTH_TOKEN: ${{ secrets.SKYNET_CLAUDE_OLLAMA_AUTH_TOKEN }}
      SKYNET_ORCHESTRATION_ALLOW_ACP_WITH_SSH: ${{ secrets.SKYNET_ORCHESTRATION_ALLOW_ACP_WITH_SSH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          path: repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deployment Python deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Repair workspace permissions
        shell: bash
        run: |
          # Self-hosted runs can leave root-owned bind-mount artifacts (for example .remote-cache).
          # Normalize ownership so git clean/reset and subsequent checkout operations stay reliable.
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/repo" || true
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE/repo" || true
          rm -rf "$GITHUB_WORKSPACE/repo/openclaw-gateway/external-skills/.remote-cache" || true
          git reset --hard
          git clean -ffdx

      - name: Validate required secrets
        shell: bash
        run: |
          : "${SKYNET_API_KEY:?Missing SKYNET_API_KEY secret}"
          : "${SKYNET_AUTH_TOKEN:?Missing SKYNET_AUTH_TOKEN secret}"
          : "${TELEGRAM_BOT_TOKEN:?Missing TELEGRAM_BOT_TOKEN secret}"

      - name: Authorize laptop SSH key for reverse tunnel
        shell: bash
        run: |
          if [ -n "${OPENCLAW_LAPTOP_SSH_PUBLIC_KEY:-}" ]; then
            mkdir -p "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 700 "$HOME/.ssh"
            chmod 600 "$HOME/.ssh/authorized_keys"
            if grep -Fqx "${OPENCLAW_LAPTOP_SSH_PUBLIC_KEY}" "$HOME/.ssh/authorized_keys"; then
              echo "Laptop SSH key already authorized on runner host."
            else
              printf '%s\n' "${OPENCLAW_LAPTOP_SSH_PUBLIC_KEY}" >> "$HOME/.ssh/authorized_keys"
              echo "Authorized laptop SSH key on runner host."
            fi
          else
            echo "OPENCLAW_LAPTOP_SSH_PUBLIC_KEY not set; skipping authorized_keys update."
          fi

      - name: Prepare SSH key material
        shell: bash
        run: |
          if [ -n "${OPENCLAW_SSH_PRIVATE_KEY_B64:-}" ]; then
            mkdir -p .secrets
            # Remove stale path if it exists as a directory (Docker creates dirs for missing bind mounts)
            if [ -d ".secrets/laptop_ed25519" ]; then
              rm -rf .secrets/laptop_ed25519
            fi
            printf '%s' "${OPENCLAW_SSH_PRIVATE_KEY_B64}" | base64 -d > .secrets/laptop_ed25519
            chmod 600 .secrets/laptop_ed25519
            # Verify it's a regular file, not a directory
            if [ ! -f ".secrets/laptop_ed25519" ]; then
              echo "ERROR: SSH key at .secrets/laptop_ed25519 is not a regular file"
              exit 1
            fi
            echo "OPENCLAW_SSH_KEY_FILE=.secrets/laptop_ed25519" >> "$GITHUB_ENV"
            if [ -z "${OPENCLAW_SSH_KEY_PATH:-}" ]; then
              echo "OPENCLAW_SSH_KEY_PATH=/app/keys/laptop_ed25519" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build deployment env file
        shell: bash
        run: |
          python scripts/ci/render_settings_env.py \
            --component control \
            --component gateway \
            --output .env.ci
          chmod 600 .env.ci

      - name: Validate SSH-primary deployment settings
        shell: bash
        run: |
          MODE="${OPENCLAW_EXECUTION_MODE:-agent_preferred}"
          case "$MODE" in
            ssh|ssh_tunnel|tunnel|ssh-only)
              : "${OPENCLAW_SSH_HOST:?Missing OPENCLAW_SSH_HOST for SSH mode}"
              : "${OPENCLAW_SSH_USER:?Missing OPENCLAW_SSH_USER for SSH mode}"
              if [ -z "${OPENCLAW_SSH_PASSWORD:-}" ] && [ -z "${OPENCLAW_SSH_KEY_PATH:-}" ]; then
                echo "SSH mode requires OPENCLAW_SSH_PASSWORD or OPENCLAW_SSH_KEY_PATH."
                exit 1
              fi
              if [ -n "${OPENCLAW_SSH_KEY_PATH:-}" ] && [[ "${OPENCLAW_SSH_KEY_PATH}" == /app/* ]] && [ -z "${OPENCLAW_SSH_PRIVATE_KEY_B64:-}" ]; then
                echo "OPENCLAW_SSH_KEY_PATH points to /app/* but OPENCLAW_SSH_PRIVATE_KEY_B64 is empty."
                exit 1
              fi
              ;;
            *)
              echo "Execution mode '$MODE' is not SSH-only; skipping strict SSH validation."
              ;;
          esac

      - name: Remove stale fixed-name containers if present
        shell: bash
        run: |
          for cname in skynet-api openclaw-gateway; do
            if docker ps -a --format '{{.Names}}' | grep -qx "$cname"; then
              echo "Removing existing $cname container to avoid name conflict"
              docker rm -f "$cname"
            fi
          done

      - name: Deploy full stack
        shell: bash
        run: |
          docker compose --env-file .env.ci up -d --build skynet-api openclaw-gateway

      - name: Verify deployment
        shell: bash
        run: |
          docker compose --env-file .env.ci ps
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/v1/health > /dev/null; then
              echo "Health check passed"
              break
            fi
            sleep 3
          done
          if ! curl -fsS http://127.0.0.1:8000/v1/health > /dev/null; then
            echo "Health check failed"
            docker compose --env-file .env.ci logs --tail=120 skynet-api
            exit 1
          fi
          docker compose --env-file .env.ci ps openclaw-gateway
          if ! docker compose --env-file .env.ci ps --status running openclaw-gateway | grep -q openclaw-gateway; then
            echo "OpenClaw gateway is not running"
            docker compose --env-file .env.ci logs --tail=120 openclaw-gateway
            exit 1
          fi
          # Verify openclaw-gateway HTTP API is responding
          GW_OK=false
          for i in {1..10}; do
            if docker exec openclaw-gateway python -c "import urllib.request; urllib.request.urlopen('http://localhost:8766/status')" 2>/dev/null; then
              echo "Gateway health check passed"
              GW_OK=true
              break
            fi
            sleep 3
          done
          if [ "$GW_OK" != "true" ]; then
            echo "Gateway health check failed on port 8766"
            docker compose --env-file .env.ci logs --tail=60 openclaw-gateway
            exit 1
          fi

      - name: SSH banner smoke (container context)
        shell: bash
        run: |
          docker exec openclaw-gateway python - <<'PY'
          import os
          import socket
          import sys

          mode = (os.getenv("OPENCLAW_EXECUTION_MODE") or "").strip().lower()
          if mode not in {"ssh", "ssh_tunnel", "tunnel", "ssh-only"}:
              print("skip: not in strict SSH mode")
              raise SystemExit(0)

          host = (os.getenv("OPENCLAW_SSH_HOST") or "").strip()
          port_raw = (os.getenv("OPENCLAW_SSH_PORT") or "2222").strip()
          if not host:
              raise SystemExit("missing OPENCLAW_SSH_HOST")
          try:
              port = int(port_raw)
          except ValueError as exc:
              raise SystemExit(f"invalid OPENCLAW_SSH_PORT: {port_raw}") from exc

          with socket.create_connection((host, port), timeout=6) as sock:
              sock.settimeout(6)
              banner = sock.recv(256).decode("utf-8", errors="ignore").strip()
          print(f"ssh_banner={banner}")
          if "SSH-" not in banner:
              raise SystemExit(f"invalid SSH banner from {host}:{port}: {banner!r}")
          PY

      - name: Validate /status diagnostics contract
        shell: bash
        run: |
          docker exec openclaw-gateway python - <<'PY'
          import config
          import json
          import urllib.request

          payload = json.loads(
              urllib.request.urlopen("http://localhost:8766/status", timeout=10).read().decode("utf-8")
          )
          required = [
              "execution_mode_effective",
              "ssh_health_ok",
              "ssh_error_category",
              "ssh_failure_streak",
              "ssh_circuit_open_until",
              "ssh_endpoint",
          ]
          missing = [key for key in required if key not in payload]
          if missing:
              raise SystemExit(f"status payload missing fields: {missing}")
          live_required = [
              "live_e2e_active",
              "live_e2e_flow",
              "live_e2e_effective_coding_stage_chain",
          ]
          live_missing = [key for key in live_required if key not in payload]
          if live_missing:
              raise SystemExit(f"status payload missing live E2E fields: {live_missing}")
          expected_live_policy = config.get_live_e2e_policy()
          if bool(payload.get("live_e2e_active")) != bool(expected_live_policy.get("active")):
              raise SystemExit(
                  "status live_e2e_active mismatch: "
                  f"payload={payload.get('live_e2e_active')!r} "
                  f"config={expected_live_policy.get('active')!r}"
              )
          if "telegram_poller_state" not in payload or "telegram_poller_lock_healthy" not in payload:
              raise SystemExit("status payload missing telegram poller diagnostics")
          if payload.get("telegram_poller_lease_enabled"):
              if payload.get("telegram_poller_state") != "running":
                  raise SystemExit(
                      "telegram poller is not running after deploy: "
                      f"{payload.get('telegram_poller_state')!r}"
                  )
              if not payload.get("telegram_poller_lock_healthy"):
                  raise SystemExit("telegram poller lease is unhealthy after deploy")
          print("status diagnostics contract ok")
          PY

      - name: Validate worker project path settings
        shell: bash
        run: |
          docker exec openclaw-gateway python - <<'PY'
          import config

          worker_projects_dir = str(getattr(config, "WORKER_PROJECTS_DIR", "") or "").strip()
          default_working_dir = str(getattr(config, "DEFAULT_WORKING_DIR", "") or "").strip()
          if not worker_projects_dir:
              raise SystemExit("WORKER_PROJECTS_DIR is empty inside openclaw-gateway")
          if not default_working_dir:
              raise SystemExit("DEFAULT_WORKING_DIR is empty inside openclaw-gateway")
          print(f"worker_projects_dir={worker_projects_dir}")
          print(f"default_working_dir={default_working_dir}")
          PY

      - name: Verify OpenClaw provider wiring
        shell: bash
        run: |
          GEMINI_ONLY_MODE_NORMALIZED="$(printf '%s' "${GEMINI_ONLY_MODE:-0}" | tr '[:upper:]' '[:lower:]')"
          if [ "$GEMINI_ONLY_MODE_NORMALIZED" = "true" ] || [ "$GEMINI_ONLY_MODE_NORMALIZED" = "yes" ] || [ "$GEMINI_ONLY_MODE_NORMALIZED" = "on" ]; then
            GEMINI_ONLY_MODE_NORMALIZED="1"
          fi

          # Ensure env vars were injected into the running container.
          if ! docker inspect openclaw-gateway --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^GOOGLE_AI_API_KEY=.'; then
            echo "GOOGLE_AI_API_KEY is not present in openclaw-gateway container env."
            exit 1
          fi
          if ! docker inspect openclaw-gateway --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^GEMINI_ONLY_MODE=.'; then
            echo "GEMINI_ONLY_MODE is not present in openclaw-gateway container env."
            exit 1
          fi

          # Give gateway a moment to log provider registration.
          sleep 5
          LOGS="$(docker logs --tail=200 openclaw-gateway 2>&1 || true)"
          if ! echo "$LOGS" | grep -q 'Registered provider: Gemini Flash'; then
            echo "Gemini provider was not registered at startup."
            echo "$LOGS"
            exit 1
          fi

          if [ "$GEMINI_ONLY_MODE_NORMALIZED" = "1" ]; then
            if echo "$LOGS" | grep -Eq 'Registered provider: (Ollama|Groq|OpenRouter|DeepSeek|OpenAI|Claude)'; then
              echo "Gemini-only mode is enabled, but non-Gemini providers were registered."
              echo "$LOGS"
              exit 1
            fi
          else
            if ! echo "$LOGS" | grep -Eq 'Registered provider: (Groq|OpenRouter|DeepSeek|OpenAI|Claude)'; then
              echo "No fallback cloud provider was registered at startup."
              echo "$LOGS"
              exit 1
            fi
          fi

      - name: Cleanup env file
        if: always()
        shell: bash
        run: rm -f .env.ci .secrets/laptop_ed25519
