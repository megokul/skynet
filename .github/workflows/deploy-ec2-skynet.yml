name: SKYNET CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: skynet-ci-cd
  cancel-in-progress: true

jobs:
  guard:
    name: Path Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check stale paths
        run: python scripts/ci/check_stale_paths.py

      - name: Check control-plane boundary
        run: python scripts/ci/check_control_plane_boundary.py

      - name: Check engineering policy
        run: python scripts/ci/check_engineering_policy.py --base-ref HEAD~1 --head-ref HEAD

  deploy:
    name: Deploy on self-hosted runner
    needs: guard
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repo
    permissions:
      contents: read
    env:
      OPENCLAW_GATEWAY_URLS: ${{ secrets.OPENCLAW_GATEWAY_URLS }}
      SKYNET_API_KEY: ${{ secrets.SKYNET_API_KEY }}
      SKYNET_AUTH_TOKEN: ${{ secrets.SKYNET_AUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_USER_ID: ${{ secrets.TELEGRAM_ALLOWED_USER_ID }}
      GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENCLAW_SSH_HOST: ${{ secrets.OPENCLAW_SSH_HOST }}
      OPENCLAW_SSH_PORT: ${{ secrets.OPENCLAW_SSH_PORT }}
      OPENCLAW_SSH_USER: ${{ secrets.OPENCLAW_SSH_USER }}
      OPENCLAW_SSH_PASSWORD: ${{ secrets.OPENCLAW_SSH_PASSWORD }}
      OPENCLAW_SSH_KEY_PATH: ${{ secrets.OPENCLAW_SSH_KEY_PATH }}
      OPENCLAW_SSH_KEY_FILE: ${{ secrets.OPENCLAW_SSH_KEY_FILE }}
      OPENCLAW_SSH_PRIVATE_KEY_B64: ${{ secrets.OPENCLAW_SSH_PRIVATE_KEY_B64 }}
      OPENCLAW_LAPTOP_SSH_PUBLIC_KEY: ${{ secrets.OPENCLAW_LAPTOP_SSH_PUBLIC_KEY }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      OPENCLAW_OLLAMA_URL: ${{ secrets.OPENCLAW_OLLAMA_URL }}
      OPENCLAW_OLLAMA_MODEL: ${{ secrets.OPENCLAW_OLLAMA_MODEL }}
      OPENCLAW_OLLAMA_AUTO_PULL: ${{ secrets.OPENCLAW_OLLAMA_AUTO_PULL }}
      SKYNET_CLAUDE_OLLAMA_AUTH_TOKEN: ${{ secrets.SKYNET_CLAUDE_OLLAMA_AUTH_TOKEN }}
      SKYNET_ORCHESTRATION_ALLOW_ACP_WITH_SSH: ${{ secrets.SKYNET_ORCHESTRATION_ALLOW_ACP_WITH_SSH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          path: repo

      - name: Repair workspace permissions
        shell: bash
        run: |
          # Self-hosted runs can leave root-owned bind-mount artifacts (for example .remote-cache).
          # Normalize ownership so git clean/reset and subsequent checkout operations stay reliable.
          if command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/repo" || true
          fi
          chmod -R u+rwX "$GITHUB_WORKSPACE/repo" || true
          rm -rf "$GITHUB_WORKSPACE/repo/openclaw-gateway/external-skills/.remote-cache" || true
          git reset --hard
          git clean -ffdx

      - name: Validate required secrets
        shell: bash
        run: |
          : "${SKYNET_API_KEY:?Missing SKYNET_API_KEY secret}"
          : "${SKYNET_AUTH_TOKEN:?Missing SKYNET_AUTH_TOKEN secret}"
          : "${TELEGRAM_BOT_TOKEN:?Missing TELEGRAM_BOT_TOKEN secret}"

      - name: Authorize laptop SSH key for reverse tunnel
        shell: bash
        run: |
          if [ -n "${OPENCLAW_LAPTOP_SSH_PUBLIC_KEY:-}" ]; then
            mkdir -p "$HOME/.ssh"
            touch "$HOME/.ssh/authorized_keys"
            chmod 700 "$HOME/.ssh"
            chmod 600 "$HOME/.ssh/authorized_keys"
            if grep -Fqx "${OPENCLAW_LAPTOP_SSH_PUBLIC_KEY}" "$HOME/.ssh/authorized_keys"; then
              echo "Laptop SSH key already authorized on runner host."
            else
              printf '%s\n' "${OPENCLAW_LAPTOP_SSH_PUBLIC_KEY}" >> "$HOME/.ssh/authorized_keys"
              echo "Authorized laptop SSH key on runner host."
            fi
          else
            echo "OPENCLAW_LAPTOP_SSH_PUBLIC_KEY not set; skipping authorized_keys update."
          fi

      - name: Prepare SSH key material
        shell: bash
        run: |
          if [ -n "${OPENCLAW_SSH_PRIVATE_KEY_B64:-}" ]; then
            mkdir -p .secrets
            # Remove stale path if it exists as a directory (Docker creates dirs for missing bind mounts)
            if [ -d ".secrets/laptop_ed25519" ]; then
              rm -rf .secrets/laptop_ed25519
            fi
            printf '%s' "${OPENCLAW_SSH_PRIVATE_KEY_B64}" | base64 -d > .secrets/laptop_ed25519
            chmod 600 .secrets/laptop_ed25519
            # Verify it's a regular file, not a directory
            if [ ! -f ".secrets/laptop_ed25519" ]; then
              echo "ERROR: SSH key at .secrets/laptop_ed25519 is not a regular file"
              exit 1
            fi
            echo "OPENCLAW_SSH_KEY_FILE=.secrets/laptop_ed25519" >> "$GITHUB_ENV"
            if [ -z "${OPENCLAW_SSH_KEY_PATH:-}" ]; then
              echo "OPENCLAW_SSH_KEY_PATH=/app/keys/laptop_ed25519" >> "$GITHUB_ENV"
            fi
          fi

      - name: Build deployment env file
        shell: bash
        run: |
          MODE_NORMALIZED="$(printf '%s' "${OPENCLAW_EXECUTION_MODE:-}" | tr '[:upper:]' '[:lower:]')"
          ORCH_DEFAULT="acp_first"
          case "$MODE_NORMALIZED" in
            ssh|ssh_tunnel|tunnel|ssh-only)
              ORCH_DEFAULT="legacy"
              ;;
          esac
          {
            printf 'SKYNET_SETTINGS_FILE=%s\n' "/app/settings/settings.yaml"
            printf 'OPENCLAW_GATEWAY_URL=%s\n' "${OPENCLAW_GATEWAY_URL:-http://openclaw-gateway:8766}"
            printf 'OPENCLAW_GATEWAY_URLS=%s\n' "${OPENCLAW_GATEWAY_URLS}"
            printf 'SKYNET_API_KEY=%s\n' "${SKYNET_API_KEY}"
            printf 'CORS_ORIGINS=%s\n' "${CORS_ORIGINS:-*}"
            printf 'SKYNET_AUTH_TOKEN=%s\n' "${SKYNET_AUTH_TOKEN}"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "${TELEGRAM_BOT_TOKEN}"
            printf 'TELEGRAM_ALLOWED_USER_ID=%s\n' "${TELEGRAM_ALLOWED_USER_ID:-0}"
            printf 'GOOGLE_AI_API_KEY=%s\n' "${GOOGLE_AI_API_KEY}"
            printf 'GEMINI_MODEL=%s\n' "${GEMINI_MODEL:-gemini-2.0-flash}"
            printf 'GEMINI_ONLY_MODE=%s\n' "${GEMINI_ONLY_MODE:-0}"
            printf 'GROQ_API_KEY=%s\n' "${GROQ_API_KEY}"
            printf 'OPENROUTER_API_KEY=%s\n' "${OPENROUTER_API_KEY}"
            printf 'OPENROUTER_MODEL=%s\n' "${OPENROUTER_MODEL:-qwen/qwen3-next-80b-a3b-instruct:free}"
            printf 'OPENROUTER_FALLBACK_MODELS=%s\n' "${OPENROUTER_FALLBACK_MODELS:-qwen/qwen3-vl-235b-a22b-thinking,openai/gpt-oss-120b:free,qwen/qwen3-coder:free,google/gemma-3n-e2b-it:free,deepseek/deepseek-r1-0528:free,meta-llama/llama-3.3-70b-instruct:free}"
            printf 'DEEPSEEK_API_KEY=%s\n' "${DEEPSEEK_API_KEY}"
            printf 'OPENAI_API_KEY=%s\n' "${OPENAI_API_KEY}"
            printf 'ANTHROPIC_API_KEY=%s\n' "${ANTHROPIC_API_KEY}"
            printf 'AI_PROVIDER_PRIORITY=%s\n' "${AI_PROVIDER_PRIORITY:-claude,gemini,openai,deepseek,openrouter,groq}"
            printf 'AUTO_APPROVE_GIT_ACTIONS=%s\n' "${AUTO_APPROVE_GIT_ACTIONS:-1}"
            printf 'AUTO_APPROVE_AND_START=%s\n' "${AUTO_APPROVE_AND_START:-1}"
            printf 'AUTO_PLAN_MIN_IDEAS=%s\n' "${AUTO_PLAN_MIN_IDEAS:-3}"
            printf 'AUTO_BOOTSTRAP_PROJECT=%s\n' "${AUTO_BOOTSTRAP_PROJECT:-1}"
            printf 'AUTO_CREATE_GITHUB_REPO=%s\n' "${AUTO_CREATE_GITHUB_REPO:-1}"
            printf 'AUTO_CREATE_GITHUB_PRIVATE=%s\n' "${AUTO_CREATE_GITHUB_PRIVATE:-0}"
            printf 'AWS_REGION=%s\n' "${AWS_REGION:-us-east-1}"
            printf 'AWS_DEFAULT_REGION=%s\n' "${AWS_DEFAULT_REGION:-us-east-1}"
            printf 'SKYNET_S3_BUCKET=%s\n' "${SKYNET_S3_BUCKET:-openclaw-artifacts}"
            printf 'SKYNET_PROJECT_BASE_DIR=%s\n' "${SKYNET_PROJECT_BASE_DIR:-E:\\MyProjects}"
            printf 'OPENCLAW_PROJECT_BASE_DIR=%s\n' "${OPENCLAW_PROJECT_BASE_DIR}"
            printf 'SKYNET_DEFAULT_WORKING_DIR=%s\n' "${SKYNET_DEFAULT_WORKING_DIR}"
            printf 'OPENCLAW_DEFAULT_WORKING_DIR=%s\n' "${OPENCLAW_DEFAULT_WORKING_DIR}"
            printf 'SKYNET_ALWAYS_ON_PROMPT_SKILLS=%s\n' "${SKYNET_ALWAYS_ON_PROMPT_SKILLS}"
            printf 'SKYNET_EXTERNAL_SKILL_URLS=%s\n' "${SKYNET_EXTERNAL_SKILL_URLS}"
            printf 'SKYNET_EXTERNAL_SKILLS_DIR=%s\n' "${SKYNET_EXTERNAL_SKILLS_DIR}"
            printf 'SKYNET_EXTERNAL_SKILLS_CACHE_DIR=%s\n' "${SKYNET_EXTERNAL_SKILLS_CACHE_DIR:-/app/data/external-skills-cache}"
            printf 'OPENCLAW_EXECUTION_MODE=%s\n' "${OPENCLAW_EXECUTION_MODE}"
            printf 'OPENCLAW_SSH_FALLBACK_ENABLED=%s\n' "${OPENCLAW_SSH_FALLBACK_ENABLED:-0}"
            printf 'OPENCLAW_SSH_HOST=%s\n' "${OPENCLAW_SSH_HOST}"
            printf 'OPENCLAW_SSH_PORT=%s\n' "${OPENCLAW_SSH_PORT:-2222}"
            printf 'OPENCLAW_SSH_USER=%s\n' "${OPENCLAW_SSH_USER}"
            printf 'OPENCLAW_SSH_PASSWORD=%s\n' "${OPENCLAW_SSH_PASSWORD}"
            printf 'OPENCLAW_SSH_KEY_PATH=%s\n' "${OPENCLAW_SSH_KEY_PATH}"
            printf 'OPENCLAW_SSH_KEY_FILE=%s\n' "${OPENCLAW_SSH_KEY_FILE:-/dev/null}"
            printf 'OPENCLAW_SSH_CONNECT_TIMEOUT=%s\n' "${OPENCLAW_SSH_CONNECT_TIMEOUT:-4}"
            printf 'OPENCLAW_SSH_COMMAND_TIMEOUT=%s\n' "${OPENCLAW_SSH_COMMAND_TIMEOUT:-180}"
            printf 'OPENCLAW_SSH_HEALTH_CACHE_SECONDS=%s\n' "${OPENCLAW_SSH_HEALTH_CACHE_SECONDS:-15}"
            printf 'OPENCLAW_SSH_MAX_PARALLEL=%s\n' "${OPENCLAW_SSH_MAX_PARALLEL:-2}"
            printf 'OPENCLAW_SSH_CIRCUIT_BREAKER_SECONDS=%s\n' "${OPENCLAW_SSH_CIRCUIT_BREAKER_SECONDS:-60}"
            printf 'OPENCLAW_SSH_CAPACITY_BACKOFF_SECONDS=%s\n' "${OPENCLAW_SSH_CAPACITY_BACKOFF_SECONDS:-30}"
            printf 'OPENCLAW_SSH_HEALTH_PROBE_TIMEOUT=%s\n' "${OPENCLAW_SSH_HEALTH_PROBE_TIMEOUT:-6}"
            printf 'OPENCLAW_SSH_REMOTE_OS=%s\n' "${OPENCLAW_SSH_REMOTE_OS:-windows}"
            printf 'OPENCLAW_SSH_ALLOWED_ROOTS=%s\n' "${OPENCLAW_SSH_ALLOWED_ROOTS:-E:\\SKYNET-SANDBOX}"
            printf 'OPENCLAW_SSH_STRICT_HOST_KEY=%s\n' "${OPENCLAW_SSH_STRICT_HOST_KEY:-0}"
            printf 'OPENCLAW_SSH_CODEX_BIN=%s\n' "${OPENCLAW_SSH_CODEX_BIN:-codex}"
            printf 'OPENCLAW_SSH_CLAUDE_BIN=%s\n' "${OPENCLAW_SSH_CLAUDE_BIN:-claude}"
            printf 'OPENCLAW_SSH_CLINE_BIN=%s\n' "${OPENCLAW_SSH_CLINE_BIN:-cline}"
            printf 'OPENCLAW_CODEX_BIN=%s\n' "${OPENCLAW_CODEX_BIN:-${OPENCLAW_SSH_CODEX_BIN:-codex}}"
            printf 'OPENCLAW_CLAUDE_BIN=%s\n' "${OPENCLAW_CLAUDE_BIN:-${OPENCLAW_SSH_CLAUDE_BIN:-claude}}"
            printf 'OPENCLAW_CLINE_BIN=%s\n' "${OPENCLAW_CLINE_BIN:-${OPENCLAW_SSH_CLINE_BIN:-cline}}"
            printf 'GH_TOKEN=%s\n' "${GH_TOKEN}"
            printf 'OPENCLAW_OLLAMA_URL=%s\n' "${OPENCLAW_OLLAMA_URL:-http://localhost:11434}"
            printf 'OPENCLAW_OLLAMA_MODEL=%s\n' "${OPENCLAW_OLLAMA_MODEL:-qwen2.5-coder:7b}"
            printf 'OPENCLAW_OLLAMA_AUTO_PULL=%s\n' "${OPENCLAW_OLLAMA_AUTO_PULL:-0}"
            printf 'SKYNET_CODING_DEFAULT_PROFILE=%s\n' "${SKYNET_CODING_DEFAULT_PROFILE:-codex_primary}"
            printf 'SKYNET_CODING_FORCE_PRIMARY_FOR_ALL=%s\n' "${SKYNET_CODING_FORCE_PRIMARY_FOR_ALL:-1}"
            printf 'SKYNET_CODING_FALLBACK_CHAIN=%s\n' "${SKYNET_CODING_FALLBACK_CHAIN:-codex,claude_ollama,cline}"
            printf 'SKYNET_ORCHESTRATION_MODE=%s\n' "${SKYNET_ORCHESTRATION_MODE:-$ORCH_DEFAULT}"
            printf 'SKYNET_ORCHESTRATION_ALLOW_ACP_WITH_SSH=%s\n' "${SKYNET_ORCHESTRATION_ALLOW_ACP_WITH_SSH:-0}"
            printf 'SKYNET_OPENCLAW_RUNTIME=%s\n' "${SKYNET_OPENCLAW_RUNTIME:-acp}"
            printf 'SKYNET_OPENCLAW_QUEUE_MODE=%s\n' "${SKYNET_OPENCLAW_QUEUE_MODE:-require_empty_queue}"
            printf 'SKYNET_OPENCLAW_RETRY_TRANSIENT=%s\n' "${SKYNET_OPENCLAW_RETRY_TRANSIENT:-1}"
            printf 'SKYNET_OPENCLAW_SESSION_TIMEOUT_SECONDS=%s\n' "${SKYNET_OPENCLAW_SESSION_TIMEOUT_SECONDS:-1800}"
            printf 'SKYNET_OPENCLAW_STAGE_CHAIN=%s\n' "${SKYNET_OPENCLAW_STAGE_CHAIN:-codex,claude,cline}"
            printf 'SKYNET_OPENCLAW_AGENT_HOSTING=%s\n' "${SKYNET_OPENCLAW_AGENT_HOSTING:-ec2_control}"
            printf 'SKYNET_OPENCLAW_TRACE_ENABLED=%s\n' "${SKYNET_OPENCLAW_TRACE_ENABLED:-1}"
            printf 'SKYNET_OPENCLAW_CLI_BIN=%s\n' "${SKYNET_OPENCLAW_CLI_BIN:-claw}"
            printf 'SKYNET_PLANNER_PRIMARY_AGENT=%s\n' "${SKYNET_PLANNER_PRIMARY_AGENT:-codex}"
            printf 'SKYNET_PLANNER_CODEX_TIMEOUT_SECONDS=%s\n' "${SKYNET_PLANNER_CODEX_TIMEOUT_SECONDS:-120}"
            printf 'SKYNET_MILESTONE_CODEX_TIMEOUT_SECONDS=%s\n' "${SKYNET_MILESTONE_CODEX_TIMEOUT_SECONDS:-120}"
            printf 'SKYNET_CODING_TRANSPORT=%s\n' "${SKYNET_CODING_TRANSPORT:-ssh_first}"
            printf 'SKYNET_E2E_FAIL_ON_SKIP=%s\n' "${SKYNET_E2E_FAIL_ON_SKIP:-1}"
            printf 'SKYNET_CLAUDE_OLLAMA_BASE_URL=%s\n' "${SKYNET_CLAUDE_OLLAMA_BASE_URL:-${OPENCLAW_OLLAMA_URL:-http://localhost:11434}}"
            printf 'SKYNET_CLAUDE_OLLAMA_AUTH_TOKEN=%s\n' "${SKYNET_CLAUDE_OLLAMA_AUTH_TOKEN:-ollama}"
            printf 'SKYNET_CLAUDE_OLLAMA_DEFAULT_MODEL=%s\n' "${SKYNET_CLAUDE_OLLAMA_DEFAULT_MODEL:-${OPENCLAW_OLLAMA_MODEL:-qwen2.5-coder:7b}}"
            printf 'SKYNET_CLAUDE_OLLAMA_AUTO_PULL=%s\n' "${SKYNET_CLAUDE_OLLAMA_AUTO_PULL:-${OPENCLAW_OLLAMA_AUTO_PULL:-0}}"
            printf 'SKYNET_CLAUDE_OLLAMA_MIN_CONTEXT=%s\n' "${SKYNET_CLAUDE_OLLAMA_MIN_CONTEXT:-64000}"
            printf 'OPENCLAW_LOG_LEVEL=%s\n' "${OPENCLAW_LOG_LEVEL:-INFO}"
            printf 'SKYNET_LOG_ENABLE_LOCAL_FILES=%s\n' "${SKYNET_LOG_ENABLE_LOCAL_FILES:-0}"
            printf 'SKYNET_LOG_ENABLE_SSH_MIRROR=%s\n' "${SKYNET_LOG_ENABLE_SSH_MIRROR:-1}"
            printf 'SKYNET_LOG_SSH_MIRROR=%s\n' "${SKYNET_LOG_SSH_MIRROR:-${SKYNET_LOG_ENABLE_SSH_MIRROR:-1}}"
            printf 'SKYNET_LOG_SSH_HOST=%s\n' "${SKYNET_LOG_SSH_HOST:-${OPENCLAW_SSH_HOST}}"
            printf 'SKYNET_LOG_SSH_PORT=%s\n' "${SKYNET_LOG_SSH_PORT:-${OPENCLAW_SSH_PORT:-2222}}"
            printf 'SKYNET_LOG_SSH_USER=%s\n' "${SKYNET_LOG_SSH_USER:-${OPENCLAW_SSH_USER}}"
            printf 'SKYNET_LOG_SSH_KEY_PATH=%s\n' "${SKYNET_LOG_SSH_KEY_PATH:-${OPENCLAW_SSH_KEY_PATH}}"
            printf 'SKYNET_LOG_SSH_PASSWORD=%s\n' "${SKYNET_LOG_SSH_PASSWORD:-${OPENCLAW_SSH_PASSWORD}}"
            printf 'SKYNET_TRACE_MIRROR_LOG_DIR=%s\n' "${SKYNET_TRACE_MIRROR_LOG_DIR:-E:\\MyProjects\\skynet\\logs}"
            printf 'SKYNET_RUNTIME_TRACE_ENABLED=%s\n' "${SKYNET_RUNTIME_TRACE_ENABLED:-1}"
            printf 'SKYNET_RUNTIME_TRACE_LIVE_FILE=%s\n' "${SKYNET_RUNTIME_TRACE_LIVE_FILE:-E:\\MyProjects\\skynet\\logs\\skynet.trace.log}"
            printf 'SKYNET_RUNTIME_TRACE_LEVEL=%s\n' "${SKYNET_RUNTIME_TRACE_LEVEL:-info}"
            printf 'SKYNET_RUNTIME_TRACE_DETAIL_PROFILE=%s\n' "${SKYNET_RUNTIME_TRACE_DETAIL_PROFILE:-max_forensic}"
            printf 'SKYNET_RUNTIME_TRACE_PAYLOAD_MODE=%s\n' "${SKYNET_RUNTIME_TRACE_PAYLOAD_MODE:-forensic_redacted}"
            printf 'SKYNET_RUNTIME_TRACE_REDACTION_MODE=%s\n' "${SKYNET_RUNTIME_TRACE_REDACTION_MODE:-forensic_redacted}"
            printf 'SKYNET_RUNTIME_TRACE_INCLUDE_STDIO_TAIL=%s\n' "${SKYNET_RUNTIME_TRACE_INCLUDE_STDIO_TAIL:-1}"
            printf 'SKYNET_RUNTIME_TRACE_STDIO_TAIL_BYTES=%s\n' "${SKYNET_RUNTIME_TRACE_STDIO_TAIL_BYTES:-4000}"
            printf 'SKYNET_RUNTIME_TRACE_STDIO_CHUNK_BYTES=%s\n' "${SKYNET_RUNTIME_TRACE_STDIO_CHUNK_BYTES:-16000}"
            printf 'SKYNET_RUNTIME_TRACE_COMMAND_PREVIEW_CHARS=%s\n' "${SKYNET_RUNTIME_TRACE_COMMAND_PREVIEW_CHARS:-2000}"
            printf 'SKYNET_RUNTIME_TRACE_DB_ENABLED=%s\n' "${SKYNET_RUNTIME_TRACE_DB_ENABLED:-1}"
            printf 'SKYNET_RUNTIME_TRACE_REQUIRE_DEBUG_BUNDLE=%s\n' "${SKYNET_RUNTIME_TRACE_REQUIRE_DEBUG_BUNDLE:-1}"
            printf 'SKYNET_RUNTIME_TRACE_REQUIRED_EVENT_ENFORCEMENT=%s\n' "${SKYNET_RUNTIME_TRACE_REQUIRED_EVENT_ENFORCEMENT:-1}"
            printf 'SKYNET_RUNTIME_TRACE_HEARTBEAT_REMOTE_SNAPSHOT=%s\n' "${SKYNET_RUNTIME_TRACE_HEARTBEAT_REMOTE_SNAPSHOT:-1}"
            printf 'SKYNET_RUNTIME_TRACE_HEARTBEAT_REMOTE_SNAPSHOT_INTERVAL_SECONDS=%s\n' "${SKYNET_RUNTIME_TRACE_HEARTBEAT_REMOTE_SNAPSHOT_INTERVAL_SECONDS:-30}"
            printf 'SKYNET_RUNTIME_TRACE_REMOTE_PROBE_TIMEOUT_SECONDS=%s\n' "${SKYNET_RUNTIME_TRACE_REMOTE_PROBE_TIMEOUT_SECONDS:-8}"
            printf 'SKYNET_RUNTIME_TRACE_PROCESS_SNAPSHOT_TOPK=%s\n' "${SKYNET_RUNTIME_TRACE_PROCESS_SNAPSHOT_TOPK:-25}"
            printf 'SKYNET_RUNTIME_TRACE_ARTIFACT_SNAPSHOT_MAX_FILES=%s\n' "${SKYNET_RUNTIME_TRACE_ARTIFACT_SNAPSHOT_MAX_FILES:-120}"
            printf 'SKYNET_RUNTIME_TRACE_PROMPT_FILE_EVENTS=%s\n' "${SKYNET_RUNTIME_TRACE_PROMPT_FILE_EVENTS:-1}"
            printf 'SKYNET_RUNTIME_TRACE_ACTIVE_SESSION_REGISTRY=%s\n' "${SKYNET_RUNTIME_TRACE_ACTIVE_SESSION_REGISTRY:-1}"
            printf 'SKYNET_RUNTIME_TRACE_STOP_CLEANUP_EVENTS=%s\n' "${SKYNET_RUNTIME_TRACE_STOP_CLEANUP_EVENTS:-1}"
            printf 'SKYNET_LOG_S3_ENABLED=%s\n' "${SKYNET_LOG_S3_ENABLED:-1}"
          } > .env.ci
          chmod 600 .env.ci

      - name: Validate SSH-primary deployment settings
        shell: bash
        run: |
          MODE="${OPENCLAW_EXECUTION_MODE:-agent_preferred}"
          case "$MODE" in
            ssh|ssh_tunnel|tunnel|ssh-only)
              : "${OPENCLAW_SSH_HOST:?Missing OPENCLAW_SSH_HOST for SSH mode}"
              : "${OPENCLAW_SSH_USER:?Missing OPENCLAW_SSH_USER for SSH mode}"
              if [ -z "${OPENCLAW_SSH_PASSWORD:-}" ] && [ -z "${OPENCLAW_SSH_KEY_PATH:-}" ]; then
                echo "SSH mode requires OPENCLAW_SSH_PASSWORD or OPENCLAW_SSH_KEY_PATH."
                exit 1
              fi
              if [ -n "${OPENCLAW_SSH_KEY_PATH:-}" ] && [[ "${OPENCLAW_SSH_KEY_PATH}" == /app/* ]] && [ -z "${OPENCLAW_SSH_PRIVATE_KEY_B64:-}" ]; then
                echo "OPENCLAW_SSH_KEY_PATH points to /app/* but OPENCLAW_SSH_PRIVATE_KEY_B64 is empty."
                exit 1
              fi
              ;;
            *)
              echo "Execution mode '$MODE' is not SSH-only; skipping strict SSH validation."
              ;;
          esac

      - name: Remove stale fixed-name containers if present
        shell: bash
        run: |
          for cname in skynet-api openclaw-gateway; do
            if docker ps -a --format '{{.Names}}' | grep -qx "$cname"; then
              echo "Removing existing $cname container to avoid name conflict"
              docker rm -f "$cname"
            fi
          done

      - name: Deploy full stack
        shell: bash
        run: |
          docker compose --env-file .env.ci up -d --build skynet-api openclaw-gateway

      - name: Verify deployment
        shell: bash
        run: |
          docker compose --env-file .env.ci ps
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/v1/health > /dev/null; then
              echo "Health check passed"
              break
            fi
            sleep 3
          done
          if ! curl -fsS http://127.0.0.1:8000/v1/health > /dev/null; then
            echo "Health check failed"
            docker compose --env-file .env.ci logs --tail=120 skynet-api
            exit 1
          fi
          docker compose --env-file .env.ci ps openclaw-gateway
          if ! docker compose --env-file .env.ci ps --status running openclaw-gateway | grep -q openclaw-gateway; then
            echo "OpenClaw gateway is not running"
            docker compose --env-file .env.ci logs --tail=120 openclaw-gateway
            exit 1
          fi
          # Verify openclaw-gateway HTTP API is responding
          GW_OK=false
          for i in {1..10}; do
            if docker exec openclaw-gateway python -c "import urllib.request; urllib.request.urlopen('http://localhost:8766/status')" 2>/dev/null; then
              echo "Gateway health check passed"
              GW_OK=true
              break
            fi
            sleep 3
          done
          if [ "$GW_OK" != "true" ]; then
            echo "Gateway health check failed on port 8766"
            docker compose --env-file .env.ci logs --tail=60 openclaw-gateway
            exit 1
          fi

      - name: SSH banner smoke (container context)
        shell: bash
        run: |
          docker exec openclaw-gateway python - <<'PY'
          import os
          import socket
          import sys

          mode = (os.getenv("OPENCLAW_EXECUTION_MODE") or "").strip().lower()
          if mode not in {"ssh", "ssh_tunnel", "tunnel", "ssh-only"}:
              print("skip: not in strict SSH mode")
              raise SystemExit(0)

          host = (os.getenv("OPENCLAW_SSH_HOST") or "").strip()
          port_raw = (os.getenv("OPENCLAW_SSH_PORT") or "2222").strip()
          if not host:
              raise SystemExit("missing OPENCLAW_SSH_HOST")
          try:
              port = int(port_raw)
          except ValueError as exc:
              raise SystemExit(f"invalid OPENCLAW_SSH_PORT: {port_raw}") from exc

          with socket.create_connection((host, port), timeout=6) as sock:
              sock.settimeout(6)
              banner = sock.recv(256).decode("utf-8", errors="ignore").strip()
          print(f"ssh_banner={banner}")
          if "SSH-" not in banner:
              raise SystemExit(f"invalid SSH banner from {host}:{port}: {banner!r}")
          PY

      - name: Validate /status diagnostics contract
        shell: bash
        run: |
          docker exec openclaw-gateway python - <<'PY'
          import json
          import urllib.request

          payload = json.loads(
              urllib.request.urlopen("http://localhost:8766/status", timeout=10).read().decode("utf-8")
          )
          required = [
              "execution_mode_effective",
              "ssh_health_ok",
              "ssh_error_category",
              "ssh_failure_streak",
              "ssh_circuit_open_until",
              "ssh_endpoint",
          ]
          missing = [key for key in required if key not in payload]
          if missing:
              raise SystemExit(f"status payload missing fields: {missing}")
          print("status diagnostics contract ok")
          PY

      - name: Verify OpenClaw provider wiring
        shell: bash
        run: |
          GEMINI_ONLY_MODE_NORMALIZED="$(printf '%s' "${GEMINI_ONLY_MODE:-0}" | tr '[:upper:]' '[:lower:]')"
          if [ "$GEMINI_ONLY_MODE_NORMALIZED" = "true" ] || [ "$GEMINI_ONLY_MODE_NORMALIZED" = "yes" ] || [ "$GEMINI_ONLY_MODE_NORMALIZED" = "on" ]; then
            GEMINI_ONLY_MODE_NORMALIZED="1"
          fi

          # Ensure env vars were injected into the running container.
          if ! docker inspect openclaw-gateway --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^GOOGLE_AI_API_KEY=.'; then
            echo "GOOGLE_AI_API_KEY is not present in openclaw-gateway container env."
            exit 1
          fi
          if ! docker inspect openclaw-gateway --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -q '^GEMINI_ONLY_MODE=.'; then
            echo "GEMINI_ONLY_MODE is not present in openclaw-gateway container env."
            exit 1
          fi

          # Give gateway a moment to log provider registration.
          sleep 5
          LOGS="$(docker logs --tail=200 openclaw-gateway 2>&1 || true)"
          if ! echo "$LOGS" | grep -q 'Registered provider: Gemini Flash'; then
            echo "Gemini provider was not registered at startup."
            echo "$LOGS"
            exit 1
          fi

          if [ "$GEMINI_ONLY_MODE_NORMALIZED" = "1" ]; then
            if echo "$LOGS" | grep -Eq 'Registered provider: (Ollama|Groq|OpenRouter|DeepSeek|OpenAI|Claude)'; then
              echo "Gemini-only mode is enabled, but non-Gemini providers were registered."
              echo "$LOGS"
              exit 1
            fi
          else
            if ! echo "$LOGS" | grep -Eq 'Registered provider: (Groq|OpenRouter|DeepSeek|OpenAI|Claude)'; then
              echo "No fallback cloud provider was registered at startup."
              echo "$LOGS"
              exit 1
            fi
          fi

      - name: Cleanup env file
        if: always()
        shell: bash
        run: rm -f .env.ci .secrets/laptop_ed25519
