# Non-secret runtime defaults for openclaw-gateway.
# Secrets must stay in environment variables (.env / GitHub Actions secrets).

# Core service
OPENCLAW_GATEWAY_URL: http://openclaw-gateway:8766
OPENCLAW_GATEWAY_URLS: ""
SKYNET_ORCHESTRATOR_URL: http://localhost:8000
CORS_ORIGINS: "*"

# HTTP / DB / logging
OPENCLAW_HTTP_HOST: 0.0.0.0
OPENCLAW_HTTP_PORT: 8766
SKYNET_DB_PATH: /app/data/skynet.db
SKYNET_LOG_LEVEL: INFO
SKYNET_LOG_ENABLE_LOCAL_FILES: false
SKYNET_LOG_ENABLE_SSH_MIRROR: true
SKYNET_LOG_S3_ENABLED: true
SKYNET_LOG_S3_PREFIX: openclaw/logs
SKYNET_TRACE_MIRROR_LOG_DIR: E:\\MyProjects\\skynet\\logs
SKYNET_RUNTIME_TRACE_ENABLED: true
SKYNET_RUNTIME_TRACE_LIVE_FILE: E:\\MyProjects\\skynet\\logs\\skynet.trace.log
SKYNET_RUNTIME_TRACE_LEVEL: info
SKYNET_RUNTIME_TRACE_DETAIL_PROFILE: max_forensic
SKYNET_RUNTIME_TRACE_PAYLOAD_MODE: forensic_redacted
SKYNET_RUNTIME_TRACE_REDACTION_MODE: forensic_redacted
SKYNET_RUNTIME_TRACE_INCLUDE_STDIO_TAIL: true
SKYNET_RUNTIME_TRACE_STDIO_TAIL_BYTES: 4000
SKYNET_RUNTIME_TRACE_STDIO_CHUNK_BYTES: 16000
SKYNET_RUNTIME_TRACE_COMMAND_PREVIEW_CHARS: 2000
SKYNET_RUNTIME_TRACE_DB_ENABLED: true
SKYNET_RUNTIME_TRACE_REQUIRE_DEBUG_BUNDLE: true
SKYNET_RUNTIME_TRACE_REQUIRED_EVENT_ENFORCEMENT: true
SKYNET_RUNTIME_TRACE_HEARTBEAT_REMOTE_SNAPSHOT: true
SKYNET_RUNTIME_TRACE_HEARTBEAT_REMOTE_SNAPSHOT_INTERVAL_SECONDS: 30
SKYNET_RUNTIME_TRACE_REMOTE_PROBE_TIMEOUT_SECONDS: 8
SKYNET_RUNTIME_TRACE_PROCESS_SNAPSHOT_TOPK: 25
SKYNET_RUNTIME_TRACE_ARTIFACT_SNAPSHOT_MAX_FILES: 120
SKYNET_RUNTIME_TRACE_PROMPT_FILE_EVENTS: true
SKYNET_RUNTIME_TRACE_ACTIVE_SESSION_REGISTRY: true
SKYNET_RUNTIME_TRACE_STOP_CLEANUP_EVENTS: true

# AI provider defaults (non-secret)
GEMINI_MODEL: gemini-2.0-flash
GEMINI_ONLY_MODE: false
OPENROUTER_MODEL: qwen/qwen3-next-80b-a3b-instruct:free
OPENROUTER_FALLBACK_MODELS: qwen/qwen3-vl-235b-a22b-thinking,openai/gpt-oss-120b:free,qwen/qwen3-coder:free,google/gemma-3n-e2b-it:free,deepseek/deepseek-r1-0528:free,meta-llama/llama-3.3-70b-instruct:free
AI_PROVIDER_PRIORITY: claude,gemini,openai,deepseek,openrouter,groq,ollama

# Project automation defaults
AUTO_APPROVE_GIT_ACTIONS: true
AUTO_APPROVE_AND_START: true
AUTO_PLAN_MIN_IDEAS: 3
AUTO_BOOTSTRAP_PROJECT: true
AUTO_CREATE_GITHUB_REPO: true
AUTO_CREATE_GITHUB_PRIVATE: false

# Paths and skills
SKYNET_PROJECT_BASE_DIR: E:\\MyProjects
OPENCLAW_PROJECT_BASE_DIR: E:\\SKYNET-SANDBOX\\Projects
SKYNET_DEFAULT_WORKING_DIR: E:\\SKYNET-SANDBOX\\Projects
OPENCLAW_DEFAULT_WORKING_DIR: E:\\SKYNET-SANDBOX\\Projects
SKYNET_ALWAYS_ON_PROMPT_SKILLS: ""
SKYNET_EXTERNAL_SKILLS_DIR: ./openclaw-gateway/external-skills
SKYNET_EXTERNAL_SKILLS_CACHE_DIR: /app/data/external-skills-cache
SKYNET_EXTERNAL_SKILL_URLS: ""

# Quality and coding policy
SKYNET_STRICT_QUALITY_GATES_ENABLED: true
SKYNET_STRICT_QUALITY_GATES_DEFAULT_PROFILE: strict
SKYNET_STRICT_QUALITY_GATES_FIX_RETRIES: 1
SKYNET_STRICT_EMPTY_OUTPUT_EMERGENCY_SCAFFOLD: true
SKYNET_ORCHESTRATION_MODE: legacy
# When false, SSH execution mode forces effective orchestration mode to legacy.
SKYNET_ORCHESTRATION_ALLOW_ACP_WITH_SSH: false
SKYNET_OPENCLAW_RUNTIME: acp
SKYNET_OPENCLAW_QUEUE_MODE: require_empty_queue
SKYNET_OPENCLAW_RETRY_TRANSIENT: true
SKYNET_OPENCLAW_SESSION_TIMEOUT_SECONDS: 1800
SKYNET_OPENCLAW_STAGE_CHAIN: codex
SKYNET_OPENCLAW_AGENT_HOSTING: ec2_control
SKYNET_OPENCLAW_TRACE_ENABLED: true
SKYNET_OPENCLAW_CLI_BIN: claw
SKYNET_CODING_DEFAULT_PROFILE: codex_primary
SKYNET_CODING_FORCE_PRIMARY_FOR_ALL: true
SKYNET_CODING_FALLBACK_CHAIN: codex
SKYNET_CODEX_WRITE_MODE: danger_full_access
SKYNET_CLAUDE_OLLAMA_STAGE_ENABLED: false
SKYNET_PLANNER_PRIMARY_AGENT: codex
SKYNET_PLANNER_ROUTER_FALLBACK_ENABLED: true
SKYNET_PLANNER_CODEX_TIMEOUT_SECONDS: 120
SKYNET_MILESTONE_CODEX_TIMEOUT_SECONDS: 120
SKYNET_CODING_TRANSPORT: websocket_primary
SKYNET_CONTROL_LOOP_ENABLED: true
SKYNET_CONTROL_LOOP_FORCE_FOR_ALL: true
SKYNET_CONTROL_LOOP_DEFAULT_PROFILE: loop_v2
SKYNET_CONTROL_LOOP_SCHEDULER_ENABLED: true
SKYNET_CONTROL_LOOP_MAX_PARALLEL_NODES: 2
SKYNET_CONTROL_LOOP_DEADLOCK_IDLE_TICKS: 3
SKYNET_CONTROL_LOOP_REPAIR_RETRIES: 1
SKYNET_CONTROL_LOOP_BUDGET_MAX_ITERATIONS: 40
SKYNET_CONTROL_LOOP_BUDGET_MAX_RUNTIME_SECONDS: 3600
SKYNET_CONTROL_LOOP_BUDGET_MAX_REPAIRS: 1
SKYNET_CONTROL_LOOP_BUDGET_MAX_TOKENS: 250000
SKYNET_CONTROL_LOOP_FAILURE_CLASSIFIER_ENABLED: true
SKYNET_CONTROL_LOOP_CRITIC_BLOCK_THRESHOLD: high
SKYNET_CONTROL_LOOP_REVIEW_CRITIC_ENABLED: true
SKYNET_CONTROL_LOOP_REVIEW_TIMEOUT_SECONDS: 120
SKYNET_CONTROL_LOOP_MEMORY_ENABLED: true
SKYNET_CONTROL_LOOP_CODE_INDEX_ENABLED: true
SKYNET_CONTROL_LOOP_CODE_INDEX_GLOBS: "*.py,*.js,*.ts,*.tsx"
SKYNET_CONTROL_LOOP_CONTEXT_COMPRESSION_ENABLED: true
SKYNET_CONTROL_LOOP_CONTEXT_MAX_CHARS: 12000
SKYNET_CONTROL_LOOP_CONTEXT_TOPK: 12
SKYNET_CONTROL_LOOP_TRACE_ENABLED: true
SKYNET_CONTROL_LOOP_TRACE_RETENTION_DAYS: 14
SKYNET_CONTROL_LOOP_TOOL_AWARE_ENABLED: true
SKYNET_CONTROL_LOOP_ARCH_CRITIC_ENABLED: true
SKYNET_CONTROL_LOOP_ARCH_RULES_FILE: openclaw-gateway/settings/architecture_rules.yaml
SKYNET_CONTROL_LOOP_COMPLETION_CONTRACT_REQUIRED: true
SKYNET_CONTROL_LOOP_PLANNER_AGENT: codex
SKYNET_CONTROL_LOOP_CRITIC_AGENT: codex
SKYNET_CONTROL_LOOP_ROUTER_FALLBACK_ENABLED: false
SKYNET_CONTROL_LOOP_DIRECTOR_ENABLED: true
SKYNET_CONTROL_LOOP_ARCHITECT_ENABLED: true
SKYNET_CONTROL_LOOP_ARCH_BLOCKING: true
SKYNET_CONTROL_LOOP_ARCH_MAX_VIOLATIONS: 0
SKYNET_CONTROL_LOOP_WORKER_POOL_ENABLED: true
SKYNET_CONTROL_LOOP_WORKER_POOL_STRATEGY: capability_priority
SKYNET_CONTROL_LOOP_DEFAULT_WORKER_ID: worker-primary
SKYNET_CONTROL_LOOP_LEARNING_ENABLED: true
SKYNET_CONTROL_LOOP_LEARNING_MIN_SAMPLES: 5
SKYNET_CONTROL_LOOP_LEARNING_APPLY_MODE: conservative
SKYNET_CONTROL_LOOP_DIRECTOR_TIMEOUT_SECONDS: 120
SKYNET_CONTROL_LOOP_ARCHITECT_TIMEOUT_SECONDS: 180
SKYNET_CONTROL_LOOP_PLANNER_TIMEOUT_SECONDS: 180
SKYNET_CONTROL_LOOP_TRACE_INCLUDE_REASONING: false
SKYNET_CODING_PROGRESS_HEARTBEAT_SECONDS: 30
SKYNET_CODING_AGENT_MAX_WAIT_SECONDS: 900
SKYNET_MILESTONE_EXTRACTION_HEARTBEAT_SECONDS: 20
SKYNET_MILESTONE_EXTRACTION_MAX_WAIT_SECONDS: 180
SKYNET_E2E_FAIL_ON_SKIP: true
SKYNET_TELEGRAM_TRACKER_ENABLED: true
SKYNET_TELEGRAM_TRACKER_EDIT_INTERVAL_SECONDS: 3
SKYNET_TELEGRAM_TRACKER_STALE_WARN_SECONDS: 90
SKYNET_TELEGRAM_TRACKER_BAR_WIDTH: 20
SKYNET_TELEGRAM_TRACKER_VERBOSE_PIPELINE: true

# Worker transport defaults (non-secret)
OPENCLAW_EXECUTION_MODE: agent_preferred
OPENCLAW_SSH_FALLBACK_ENABLED: true
SKYNET_WEBSOCKET_PRIMARY_ENABLED: true
SKYNET_WEBSOCKET_ACCEPT_TIMEOUT_SECONDS: 3
SKYNET_WEBSOCKET_REPLAY_TIMEOUT_SECONDS: 30
SKYNET_WEBSOCKET_HEARTBEAT_STALE_SECONDS: 45
SKYNET_WEBSOCKET_FALLBACK_TO_SSH: true
OPENCLAW_SSH_HOST: host.docker.internal
OPENCLAW_SSH_PORT: 2222
OPENCLAW_SSH_USER: ""
OPENCLAW_SSH_KEY_PATH: /app/keys/laptop_ed25519
OPENCLAW_SSH_KEY_FILE: .secrets/laptop_ed25519
OPENCLAW_SSH_CONNECT_TIMEOUT: 8
OPENCLAW_SSH_COMMAND_TIMEOUT: 180
OPENCLAW_SSH_HEALTH_CACHE_SECONDS: 15
OPENCLAW_SSH_MAX_PARALLEL: 2
OPENCLAW_SSH_CIRCUIT_BREAKER_SECONDS: 60
OPENCLAW_SSH_CAPACITY_BACKOFF_SECONDS: 30
OPENCLAW_SSH_HEALTH_PROBE_TIMEOUT: 6
OPENCLAW_SSH_REMOTE_OS: windows
OPENCLAW_SSH_ALLOWED_ROOTS: E:\\SKYNET-SANDBOX
OPENCLAW_SSH_STRICT_HOST_KEY: false
OPENCLAW_SSH_CODEX_BIN: codex
OPENCLAW_SSH_CLAUDE_BIN: claude
OPENCLAW_SSH_CLINE_BIN: cline
OPENCLAW_CODEX_BIN: codex
OPENCLAW_CLAUDE_BIN: claude
OPENCLAW_CLINE_BIN: cline
OPENCLAW_SSH_CLAUDE_PERMISSION_MODE: bypassPermissions
OPENCLAW_SSH_CLAUDE_DISABLE_SLASH_COMMANDS: false
OPENCLAW_SSH_CLAUDE_DANGEROUSLY_SKIP_PERMISSIONS: false
SKYNET_LOG_ENABLE_WEBSOCKET_MIRROR: true
SKYNET_LOG_WEBSOCKET_REQUIRE_ACK: true
SKYNET_LOG_WEBSOCKET_ACK_TIMEOUT_SECONDS: 5

# Claude-over-Ollama defaults (non-secret)
OPENCLAW_OLLAMA_URL: http://localhost:11434
OPENCLAW_OLLAMA_MODEL: qwen2.5-coder:7b
OPENCLAW_OLLAMA_AUTO_PULL: false
SKYNET_CLAUDE_OLLAMA_BASE_URL: http://localhost:11434
SKYNET_CLAUDE_OLLAMA_AUTH_TOKEN: ollama
SKYNET_CLAUDE_OLLAMA_DEFAULT_MODEL: qwen2.5-coder:7b
SKYNET_CLAUDE_OLLAMA_AUTO_PULL: false
SKYNET_CLAUDE_OLLAMA_MIN_CONTEXT: 64000

# AWS non-secret defaults
AWS_REGION: us-east-1
AWS_DEFAULT_REGION: us-east-1
SKYNET_S3_BUCKET: openclaw-artifacts
