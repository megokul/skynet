services:
  gateway:
    build: .
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "8765:8765"   # WebSocket (worker/CLAW connects here)
      - "8766:8766"   # HTTP API  (loopback dispatch — expose only if needed externally)
    environment:
      # ── Required ────────────────────────────────────────────────────────────
      - SKYNET_AUTH_TOKEN          # shared secret — must match CLAW worker
      - TELEGRAM_BOT_TOKEN         # from BotFather
      - SKYNET_BUILD_REVISION
      # ── Bot access control ──────────────────────────────────────────────────
      - TELEGRAM_ALLOWED_USER_ID   # set to your Telegram user ID (0 = allow all)
      # ── TLS (paths are inside the container) ────────────────────────────────
      - SKYNET_TLS_CERT=/app/certs/cert.pem
      - SKYNET_TLS_KEY=/app/certs/key.pem
      # ── HTTP API ────────────────────────────────────────────────────────────
      - SKYNET_HTTP_HOST=${SKYNET_HTTP_HOST:-0.0.0.0}
      - SKYNET_HTTP_PORT=${SKYNET_HTTP_PORT:-8766}
      # ── Logging ─────────────────────────────────────────────────────────────
      - SKYNET_LOG_LEVEL=${SKYNET_LOG_LEVEL:-INFO}
      - SKYNET_LOG_LOCAL_FILES=${SKYNET_LOG_LOCAL_FILES:-0}
      - SKYNET_LOG_SSH_MIRROR=${SKYNET_LOG_SSH_MIRROR:-0}
      - SKYNET_LOG_SSH_HOST
      - SKYNET_LOG_SSH_PORT
      - SKYNET_LOG_SSH_USER
      - SKYNET_LOG_SSH_KEY_PATH
      - SKYNET_LOG_SSH_PASSWORD
      - SKYNET_TRACE_MIRROR_LOG_DIR
      # ── AI providers (set whichever you have) ───────────────────────────────
      - GOOGLE_AI_API_KEY
      - GROQ_API_KEY
      - OPENROUTER_API_KEY
      - DEEPSEEK_API_KEY
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      # ── Web search ──────────────────────────────────────────────────────────
      - BRAVE_SEARCH_API_KEY
      # ── SSH tunnel fallback (optional — for worker-less laptop access) ──────
      - OPENCLAW_EXECUTION_MODE
      - OPENCLAW_SSH_FALLBACK_ENABLED
      - OPENCLAW_SSH_HOST
      - OPENCLAW_SSH_PORT
      - OPENCLAW_SSH_USER
      - OPENCLAW_SSH_PASSWORD
      - OPENCLAW_SSH_KEY_PATH
      - OPENCLAW_SSH_KEY_FILE
      - OPENCLAW_SSH_CONNECT_TIMEOUT
      - OPENCLAW_SSH_COMMAND_TIMEOUT
      - OPENCLAW_SSH_HEALTH_CACHE_SECONDS
      - OPENCLAW_SSH_REMOTE_OS
      - OPENCLAW_SSH_ALLOWED_ROOTS
      - OPENCLAW_SSH_STRICT_HOST_KEY
      - OPENCLAW_SSH_CODEX_BIN
      - OPENCLAW_SSH_CLAUDE_BIN
      - OPENCLAW_SSH_CLINE_BIN
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - gateway-data:/app/data
      - ${OPENCLAW_TLS_CERT_DIR:-./certs}:/app/certs:ro
      - ${OPENCLAW_SSH_KEY_FILE:-/dev/null}:${OPENCLAW_SSH_KEY_PATH:-/app/keys/laptop_ed25519}:ro

volumes:
  gateway-data:
    driver: local
